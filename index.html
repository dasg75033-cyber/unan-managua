<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mapa Interactivo UNAN Managua</title>

    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="shortcut icon" href="assets/favicon/favicon.ico">
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid p-0"> 
        <div class="row g-0 min-vh-100"> 

            <div class="col-12 col-lg-4 sidebar p-3 p-lg-4"> 
                
                <h1><img src="assets/logo.png" alt="Logo UNAN" width="36" height="36"> UNAN Managua</h1>
                <h2 id="lema" class="mb-3"></h2>

                <label for="idioma" id="labelIdioma" class="form-label mt-2">Idioma</label>
                <select id="idioma" class="form-select mb-3" aria-label="Seleccionar idioma de la interfaz"> 
                    <option value="es" selected>Español</option>
                    <option value="mi">Miskito</option>
                    <option value="cab">Garífuna</option>
                    <option value="nah">Náhuatl</option>
                    <option value="yan">Mayagna</option>
                    <option value="en">English</option>
                </select>

                <button id="gen" aria-label="Generar código QR y mostrar mapa" class="btn btn-warning w-100 mb-3"></button>

                <label for="busqueda" id="labelBusqueda" class="form-label">Buscar lugar</label>
                <div class="search-wrapper mb-3">
                    <input type="text" id="busqueda" placeholder="Escribe nombre o número" class="form-control" autocomplete="off" spellcheck="false">
                    <button type="button" id="btnClearSearch" class="search-clear-btn d-none" aria-label="Limpiar búsqueda">&times;</button>
                </div>
                
                <div id="searchLiveFeedback" class="visually-hidden" role="status" aria-live="polite"></div>

                <div id="emptyState" class="empty-state d-none" role="region" aria-label="Sin resultados de búsqueda">
                    <p id="emptyStateText"></p>
                    <div id="emptyStateChips" class="suggestion-chips"></div>
                </div>

                <label for="destino" id="labelDestino" class="form-label"></label>
                <select id="destino" class="form-select mb-3" aria-label="Selecciona pabellón o lugar principal"></select>

                <label for="aula" id="labelAula" class="form-label"></label>
                <select id="aula" class="form-select mb-3" aria-label="Selecciona aula o subdestino"><option value="">--</option></select>

                <button id="btnDarkMode" class="btn btn-warning w-100 mb-3" aria-label="Alternar modo oscuro y claro"></button>
            </div> 

            <div class="col-12 col-lg-8 content p-0 d-flex flex-column"> 
                
                <div class="map-holder flex-grow-1 position-relative"> 
                    <iframe id="map" title="Mapa de ubicación campus UNAN Managua" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade" class="w-100 h-100 border-0"></iframe>
                    <div id="offlineNotice" class="offline-badge d-none" role="status">
                        <span class="offline-dot"></span> <span id="offlineNoticeText">Sin conexión</span>
                    </div>
                </div>

                <div class="qr-panel flex-shrink-0">
                    <div class="qr-card">
                        <div class="qr-card-header">
                            <h3 id="qrLocationTitle" class="qr-location-title">UNAN Managua</h3>
                            <p id="qrLocationSubtitle" class="qr-location-subtitle"></p>
                        </div>
                        <div class="qr-card-body">
                            <div class="qr-canvas-box" id="qr"></div>
                        </div>
                        <div class="qr-card-actions">
                            <button type="button" id="btnOpenMaps" class="btn btn-outline-primary qr-action-btn" aria-label="Abrir en Google Maps">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg>
                                <span id="textBtnOpenMaps">Abrir en Maps</span>
                            </button>
                            <button type="button" id="btnCopyLink" class="btn btn-outline-secondary qr-action-btn" aria-label="Copiar enlace de ubicación">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                <span id="textBtnCopyLink">Copiar Enlace</span>
                            </button>
                            <button type="button" id="btnDownloadQr" class="btn btn-outline-dark qr-action-btn" aria-label="Descargar código QR">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                <span id="textBtnDownloadQr">Descargar QR</span>
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eGceHNDzF5b2D1y" crossorigin="anonymous"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="main.js" type="module"></script>
</body>
</html>
